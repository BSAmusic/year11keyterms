<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGCSE Music Revision</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf8f1;--card:#fff;--ink:#1d1b16;--mute:#6b665a;--line:#ddd6c4;--ok:#1f8a4c;--okbg:#d9f2e2;--bad:#c0392b;--badbg:#f8dcd8;--on:#1d1b16;--onfg:#fff;
--c0:#f6cf3f;--c1:#a6e05e;--c2:#8ccdf0;--c3:#f5b472}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--card:#242217;--ink:#f3efe2;--mute:#a49f8e;--line:#3d3a2b;--okbg:#17402a;--badbg:#4a201b;--ok:#6fd39a;--bad:#ff8d80;--on:#f6cf3f;--onfg:#1d1b16}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
header{padding:22px 18px 8px;max-width:980px;margin:auto}
h1{font:800 clamp(28px,6vw,44px)/1.05 "Trebuchet MS",Verdana,sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0}
nav{display:flex;gap:6px;overflow-x:auto;max-width:980px;margin:12px auto 0;padding:0 18px 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;font:600 15px "Trebuchet MS",Verdana,sans-serif;padding:9px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-current=page]{background:var(--on);color:var(--onfg)}
main{max-width:980px;margin:auto;padding:14px 18px 60px}
h2{font:700 24px "Trebuchet MS",Verdana,sans-serif;margin:6px 0 4px}
button{font-family:inherit}
:focus-visible{outline:3px solid #2b6ef0;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input[type=search]{flex:1 1 220px;padding:10px 12px;font:16px inherit;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.chip{padding:8px 13px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;font:600 14px "Trebuchet MS",sans-serif}
.chip[aria-pressed=true]{background:var(--on);color:var(--onfg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.t{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;border-left-width:12px}
.t b{font:700 18px "Trebuchet MS",sans-serif;display:block}
.t span{font-size:15px;color:var(--mute)}
.pill{display:inline-block;font:700 12px "Trebuchet MS",sans-serif;padding:2px 9px;border-radius:999px;color:#1d1b16;margin-bottom:4px}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.cols>div{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:10px 13px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;line-height:1.35}
.opt.on,.opt.sel{background:var(--on);color:var(--onfg)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.miss{background:transparent;border:2px dashed var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.stats{display:flex;gap:14px;flex-wrap:wrap;font:600 15px "Trebuchet MS",sans-serif;color:var(--mute);margin:8px 0}
.go{padding:11px 20px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:700 16px "Trebuchet MS",sans-serif;cursor:pointer;margin-top:14px}
.q{font:700 21px/1.3 "Trebuchet MS",sans-serif;margin:10px 0}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line)}
.box{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px}
.desc{font-style:italic;border-left:6px solid var(--c0);padding-left:12px;margin:8px 0 14px}
h3{font:700 15px "Trebuchet MS",sans-serif;margin:14px 0 6px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
</style></head><body>
<header><h1>IGCSE Music revision</h1><p class="sub">Areas of Study 1, 2, 3 and 5: Baroque, Classical, Romantic and Music for Dance.</p></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const AREAS=["Baroque","Classical","Romantic","Music for Dance"],COL=["var(--c0)","var(--c1)","var(--c2)","var(--c3)"];
const T=[
["Ritornello form","Recurring orchestral passages alternate with freer solo or concertino episodes.",0],
["Concertino","The small group of soloists (e.g. 2 violins and cello) in a concerto grosso.",0],
["Ripieno","The full string orchestra that contrasts with the soloist(s) in a Baroque concerto.",0],
["Basso continuo","Harpsichord or organ with cello or bassoon, providing the harmonic and rhythmic foundation.",0],
["Terraced dynamics","Sudden shifts in volume rather than gradual crescendos and diminuendos.",0],
["Cadenza","An improvised or written-out virtuoso passage for the soloist, usually near the end of a movement.",0],
["Unity of mood","Each movement tends to sustain one affective character throughout.",0],
["Ornamentation","Decorations such as trills, mordents and turns added to a melody.",0],
["String quartet","The most important chamber ensemble: 2 violins, viola and cello.",1],
["Sonata form","A structure in three sections: exposition, development and recapitulation.",1],
["Exposition","Introduces the main themes: first subject in the tonic, second subject in a new key. Usually repeated.",1],
["Development","Themes are developed and transformed with frequent modulation to distant keys, building tension.",1],
["Recapitulation","The return of the exposition material, with both subjects now in the tonic key.",1],
["Bridge (transition)","The passage in the exposition that modulates from the tonic to a new key.",1],
["Codetta","A short passage that rounds off the exposition, often with cadences.",1],
["Alberti bass","A simple broken-chord accompaniment, typically played by the left hand of the piano.",1],
["Minuet and Trio","A dance-like movement in triple time, the third movement of a Classical string quartet.",1],
["Equality of parts","Instruments in a quartet interact conversationally rather than just accompanying.",1],
["Programmatic music","Music based on a story, poem, myth, landscape or emotion.",2],
["Symphonic poem","A single-movement orchestral work (also called a tone poem) that tells a story or paints a scene.",2],
["Thematic transformation","One theme changes character to reflect different moods or scenes.",2],
["Leitmotif","A recurring theme linked to a character, place or idea.",2],
["Chromatic harmony","Rich chords, adventurous modulations and blurred tonal centres.",2],
["Nationalism","Use of folk tunes, dances or patriotic subjects to express pride in a homeland.",2],
["Folk elements","Folk songs, dances, rhythms and scales taken from a composer’s own country.",2],
["Colourful orchestration","New instrumental combinations in a larger orchestra, used for dramatic effect.",2],
["Habanera rhythm","The long–short–long–long rhythm found in tango.",3],
["Bandoneón","A type of accordion used in the traditional tango ensemble.",3],
["Orquesta típica","The traditional tango ensemble: bandoneón, violin, double bass, piano and sometimes guitar.",3],
["Clave","The 3–2 or 2–3 rhythmic pattern that is the foundation of salsa.",3],
["Tumbao","A syncopated salsa bass pattern that avoids the downbeat.",3],
["Montuno","Repeating, syncopated piano chord patterns in salsa.",3],
["Coro-pregón","A salsa section of improvised call-and-response between lead singer and chorus.",3],
["Four-on-the-floor","A steady 4/4 beat with the kick drum on every beat, typical of EDM.",3],
["Build-up and drop","Tension rises through a building section, then releases with a beat drop.",3],
["Side-chaining","A production effect that makes basslines “pump” in time with the kick drum.",3],
["DAW","Digital audio workstation: software used to sample, sequence with MIDI and produce EDM.",3],
["Sampling","Taking recorded sounds or vocals and chopping or processing them for use in a new track.",3]];
const sh=a=>[...a].sort(()=>Math.random()-.5);
const main=document.getElementById("main"),nav=document.getElementById("nav");
const PAGES=["1 Term bank","2 Match up","3 Sort by area","4 Select all","5 Exam practice"];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pill(a){const p=el("span","pill",AREAS[a]);p.style.background=COL[a];return p}
function show(i){[...nav.children].forEach((b,j)=>j==i?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));main.innerHTML="";[p1,p2,p3,p4,p5][i]();try{location.hash="p"+(i+1)}catch(e){}window.scrollTo(0,0)}
PAGES.forEach((n,i)=>{const b=el("button","",n);b.onclick=()=>show(i);nav.append(b)});
function group(box,opts,multi){const sel=new Set();opts.forEach((o,i)=>{const b=el("button","opt",o.t);b.onclick=()=>{if(box.dataset.done)return;if(multi){sel.has(i)?sel.delete(i):sel.add(i)}else{sel.clear();sel.add(i)}[...box.children].forEach((c,j)=>c.classList.toggle("on",sel.has(j)))};box.append(b)});return sel}
function reveal(box,opts,sel){box.dataset.done=1;[...box.children].forEach((c,j)=>{c.classList.remove("on");if(opts[j].ok)c.classList.add(sel.has(j)?"ok":"miss");else if(sel.has(j))c.classList.add("bad")});return opts.every((o,j)=>!!o.ok===sel.has(j))}

/* PAGE 1 */
function p1(){main.append(el("h2","","Term bank"),el("p","sub","Search or filter, then use the other pages to test yourself."));
let f=-1,q="";const bar=el("div","bar"),s=el("input");s.type="search";s.placeholder="Search terms or definitions";s.setAttribute("aria-label","Search terms");bar.append(s);
const chips=["All",...AREAS].map((n,i)=>{const c=el("button","chip",n);c.setAttribute("aria-pressed",i==0);c.onclick=()=>{f=i-1;chips.forEach((x,j)=>x.setAttribute("aria-pressed",j==i));draw()};bar.append(c);return c});
const g=el("div","grid");main.append(bar,g);
function draw(){g.innerHTML="";const r=T.filter(t=>(f<0||t[2]==f)&&(t[0]+t[1]).toLowerCase().includes(q));if(!r.length)g.append(el("p","sub","No terms match. Try a shorter search."));r.forEach(t=>{const d=el("div","t");d.style.borderLeftColor=COL[t[2]];d.append(pill(t[2]),el("b","",t[0]),el("span","",t[1]));g.append(d)})}
s.oninput=()=>{q=s.value.toLowerCase();draw()};draw()}

/* PAGE 2 */
function p2(){main.append(el("h2","","Match up"),el("p","sub","Tap a term, then tap its definition."));
const set=sh(T).slice(0,6),L=sh(set.map((_,i)=>i)),R=sh(set.map((_,i)=>i));let tl=null,tr=null,done=0,miss=0;
const st=el("div","stats"),c=el("div","cols"),a=el("div"),b=el("div");c.append(a,b);
const upd=()=>st.textContent="Matched "+done+" of 6   Mistakes "+miss;upd();
const lb=L.map(i=>{const x=el("button","opt",set[i][0]);x.onclick=()=>pick("l",i,x);a.append(x);return x}),rb=R.map(i=>{const x=el("button","opt",set[i][1]);x.onclick=()=>pick("r",i,x);b.append(x);return x});
function pick(side,i,x){if(x.disabled)return;const arr=side=="l"?lb:rb;arr.forEach(y=>y.classList.remove("sel"));x.classList.add("sel");if(side=="l")tl=[i,x];else tr=[i,x];
if(tl&&tr){const[A,xa]=tl,[B,xb]=tr;tl=tr=null;if(A==B){[xa,xb].forEach(y=>{y.classList.remove("sel");y.classList.add("ok");y.disabled=true});done++;upd();if(done==6){const m=el("div","fb","All matched with "+miss+" mistake"+(miss==1?"":"s")+".");main.append(m)}}else{miss++;upd();[xa,xb].forEach(y=>{y.classList.remove("sel");y.classList.add("bad")});setTimeout(()=>[xa,xb].forEach(y=>y.classList.remove("bad")),700)}}}
const n=el("button","go","New round");n.onclick=()=>show(1);main.append(st,c,n)}

/* PAGE 3 */
function p3(){main.append(el("h2","","Sort by area"),el("p","sub","Which area of study does each term belong to?"));
const qs=sh(T).slice(0,10);let i=0,sc=0;const box=el("div","box");main.append(box);
function draw(){box.innerHTML="";if(i>=qs.length){box.append(el("div","q","Score: "+sc+" out of "+qs.length));const r=el("button","go","Play again");r.onclick=()=>show(2);box.append(r);return}
const t=qs[i];box.append(el("div","stats","Question "+(i+1)+" of "+qs.length+"   Score "+sc),el("div","q",t[0]));
const o=el("div","opts");AREAS.forEach((n,k)=>{const b=el("button","opt",n);b.onclick=()=>{if(o.dataset.done)return;o.dataset.done=1;if(k==t[2]){sc++;b.classList.add("ok")}else{b.classList.add("bad");o.children[t[2]].classList.add("ok")}
const f=el("div","fb",(k==t[2]?"Correct. ":"Not quite. It belongs to "+AREAS[t[2]]+". ")+t[1]);const nx=el("button","go",i==qs.length-1?"See score":"Next term");nx.onclick=()=>{i++;draw()};box.append(f,nx)};o.append(b)});box.append(o)}
draw()}

/* PAGE 4 */
const M=[
["What can usually be heard in a Baroque concerto? Select 3.",["Basso continuo","Terraced dynamics","Ritornello form","Leitmotifs","Four-on-the-floor kick drum"],[0,1,2]],
["Which are typical of Classical chamber music? Select 3.",["Equality of parts","Regular 4 or 8 bar phrases","Alberti bass accompaniment","Expanded brass and percussion","The clave rhythm"],[0,1,2]],
["What happens in the development section of sonata form? Select 3.",["Frequent modulation to distant keys","Themes are developed and transformed","Sequences, imitation and counterpoint","The second subject returns in the tonic","A codetta rounds off the section"],[0,1,2]],
["What happens in the recapitulation? Select 3.",["The first subject returns in the tonic","The second subject is also in the tonic","Balance and resolution are restored","Themes are heard for the first time","Modulation to distant keys"],[0,1,2]],
["Which are features of Romantic single-movement orchestral works? Select 4.",["Larger orchestra","Chromatic harmony","Thematic transformation","Dramatic contrasts in tempo and dynamics","Terraced dynamics"],[0,1,2,3]],
["Which belong to musical nationalism? Select 3.",["Folk tunes and dances","Patriotic subjects","Links to 19th-century independence movements","The habanera rhythm","Cadenzas for the soloist"],[0,1,2]],
["What can usually be heard in tango? Select 4.",["Bandoneón","Minor keys","Habanera rhythm","Staccato, dramatic phrasing","Montuno piano patterns"],[0,1,2,3]],
["What can usually be heard in salsa? Select 4.",["Clave rhythm","Congas, bongos and timbales","Call-and-response vocals","Brass riffs","Bandoneón"],[0,1,2,3]],
["What can usually be heard in electronic dance music? Select 3.",["Four-on-the-floor kick drum","Build-ups and drops","Synthesizers and effects","Alberti bass","Orquesta típica"],[0,1,2]]];
function p4(){main.append(el("h2","","Select all that apply"),el("p","sub","Choose every correct answer, then check."));
const qs=sh(M);let i=0,sc=0;const box=el("div","box");main.append(box);
function draw(){box.innerHTML="";if(i>=qs.length){box.append(el("div","q","Score: "+sc+" out of "+qs.length));const r=el("button","go","Play again");r.onclick=()=>show(3);box.append(r);return}
const q=qs[i],opts=sh(q[1].map((t,k)=>({t,ok:q[2].includes(k)})));box.append(el("div","stats","Question "+(i+1)+" of "+qs.length+"   Score "+sc),el("div","q",q[0]));
const o=el("div","opts"),sel=group(o,opts,true);box.append(o);const ck=el("button","go","Check answer");
ck.onclick=()=>{if(!sel.size)return;const r=reveal(o,opts,sel);if(r)sc++;ck.remove();box.append(el("div","fb",r?"Correct, you found them all.":"Not quite. Green is correct, dashed green is one you missed, red is incorrect."));const nx=el("button","go",i==qs.length-1?"See score":"Next question");nx.onclick=()=>{i++;draw()};box.append(nx)};box.append(ck)}
draw()}

/* PAGE 5 */
const G=["Baroque solo concerto","Baroque concerto grosso","Classical chamber music","Romantic programmatic music","Tango","Salsa","Electronic dance music"];
const S=[
["Small string orchestra. Two violins and a cello trade phrases with the full ensemble, a harpsichord plays throughout, and the volume switches suddenly between sections.",1,["Concertino versus ripieno contrast","Basso continuo","Terraced dynamics","Leitmotifs","Alberti bass","Thematic transformation"],[0,1,2]],
["Four players, one to a part, with no conductor. The fast first movement has two contrasting themes, the second moving to the dominant. The third movement is a dance in triple time.",2,["Sonata form in the first movement","Minuet and Trio","Equality of parts","Ritornello form","Clave rhythm","Chromatic modulations to blur the key"],[0,1,2]],
["A very large orchestra tells the story of a river in the composer’s homeland. One flowing theme keeps returning in a different mood, with rich chromatic harmony and a folk-style melody.",3,["Thematic transformation","Folk elements (nationalism)","Colourful, expanded orchestration","Terraced dynamics","Basso continuo","Four-on-the-floor beat"],[0,1,2]],
["A syncopated bass avoids the downbeat. Brass riffs answer a lead singer, a piano repeats rhythmic chords, and the percussion plays a 3–2 pattern.",5,["Tumbao bass","Montuno piano","Clave rhythm","Bandoneón","Side-chaining","Cadenza"],[0,1,2]],
["At 128 BPM a loop builds with rising sweeps, then drops. The bass pumps with the kick, which falls on every beat.",6,["Build-up and drop","Four-on-the-floor kick","Side-chained bass","Orquesta típica","Ripieno","Coro-pregón"],[0,1,2]],
["A soloist plays with an orchestra. The orchestral theme returns between freer solo episodes full of scales and arpeggios. Near the end the orchestra stops for an unaccompanied showpiece.",0,["Ritornello form","Virtuosic solo writing","Cadenza","Leitmotifs","Habanera rhythm","Development section"],[0,1,2]]];
function p5(){main.append(el("h2","","Exam practice: name the style"),el("p","sub","Read the description of an unheard extract. Identify the genre, then pick the three features that prove it. Each scenario is worth 2 marks."));
const qs=sh(S);let i=0,sc=0;const box=el("div","box");main.append(box);
function draw(){box.innerHTML="";if(i>=qs.length){box.append(el("div","q","Score: "+sc+" out of "+qs.length*2));const r=el("button","go","Try again");r.onclick=()=>show(4);box.append(r);return}
const q=qs[i];box.append(el("div","stats","Scenario "+(i+1)+" of "+qs.length+"   Score "+sc),el("p","desc",q[0]),el("h3","","Step 1. Which genre is this?"));
const go=G.map((t,k)=>({t,ok:k==q[1]})),gb=el("div","opts"),gs=group(gb,go,false);
const fo=sh(q[2].map((t,k)=>({t,ok:q[3].includes(k)}))),fb=el("div","opts"),fs=group(fb,fo,true);
box.append(gb,el("h3","","Step 2. Select the 3 features that support your answer"),fb);const ck=el("button","go","Check answers");
ck.onclick=()=>{if(!gs.size||fs.size!=3){alert("Choose one genre and exactly 3 features.");return}const a=reveal(gb,go,gs),b=reveal(fb,fo,fs);sc+=(a?1:0)+(b?1:0);ck.remove();
box.append(el("div","fb",(a?"Genre correct. ":"Genre: "+G[q[1]]+". ")+(b?"All three features correct.":"Features: "+q[3].map(k=>q[2][k]).join(", ")+".")));const nx=el("button","go",i==qs.length-1?"See score":"Next scenario");nx.onclick=()=>{i++;draw()};box.append(nx)};box.append(ck)}
draw()}
const h=parseInt((location.hash||"").slice(2));show(h>=1&&h<=5?h-1:0);
</script></body></html>
